spring.application.name=server

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_network?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=your_database_username
spring.datasource.password=your_database_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# JWT Configuration
# Generate a secure Base64 encoded secret key (min 256 bits for HS256)
# You can generate one using: openssl rand -base64 64
jwt.secret=your_base64_encoded_secret_key_here_minimum_256_bits_required
jwt.expiration=86400000

# Brevo API Configuration
brevo.api.key=your_brevo_api_key_here
brevo.api.url=https://api.brevo.com/v3/smtp/email

# Application Configuration
app.frontend.url=http://localhost:5173
app.mail.from.email=your_email@example.com
app.mail.from.name=Alumni Network
